<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindo | Web Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #343541; color: #ececf1; display: flex; height: 100vh; overflow: hidden; }
        aside { width: 260px; background-color: #202123; padding: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .sidebar-header { font-weight: bold; padding: 10px; text-align: center; border-bottom: 1px solid #4e4f60; font-size: 18px; color: #fff; }
        .nav-btn { background: transparent; border: 1px solid #4e4f60; color: #fff; padding: 12px; border-radius: 5px; cursor: pointer; text-align: left; font-size: 14px; width: 100%; transition: 0.2s; }
        .nav-btn:hover, .nav-btn.active { background-color: #2a2b32; }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .history-list button { background: transparent; border: none; color: #ececf1; padding: 10px; text-align: left; border-radius: 5px; cursor: pointer; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-list button:hover { background-color: #2a2b32; }
        .history-list button.active { background-color: #343541; }
        .stats-area { background: #2a2b32; padding: 10px; border-radius: 5px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; }
        main { flex: 1; display: flex; flex-direction: column; background-color: #343541; position: relative; }
        .chat-header { padding: 15px; border-bottom: 1px solid #2a2b32; background: #343541; font-weight: bold; text-align: center; }
        .messages-container { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; }
        .message { padding: 20px; display: flex; gap: 20px; line-height: 1.6; word-break: break-word; }
        .message.user { background-color: #343541; }
        .message.bot { background-color: #444654; }
        .avatar { width: 30px; height: 30px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; }
        .message.user .avatar { background: #5436da; }
        .message.bot .avatar { background: #10a37f; }
        .text { flex: 1; font-size: 15px; white-space: pre-wrap; }
        .input-area { padding: 20px; background: linear-gradient(180deg, rgba(52,53,65,0), #343541 20px); }
        .input-container { max-width: 768px; margin: 0 auto; position: relative; display: flex; background: #40414f; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.1); border: 1px solid #303139; }
        input { flex: 1; background: transparent; border: none; padding: 15px; color: #fff; font-size: 15px; outline: none; }
        .send-btn { background: transparent; border: none; color: #acacbe; padding: 0 15px; cursor: pointer; font-size: 18px; }
        .send-btn:hover { color: #fff; }
        .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; padding: 20px; }
        .welcome-screen h1 { font-size: 32px; margin-bottom: 10px; color: #fff; }
        .welcome-screen p { color: #c5c5d2; font-size: 16px; }
        .menu-toggle { display: none; background: #202123; border: none; color: #fff; padding: 10px; font-size: 20px; cursor: pointer; text-align: left; }
        
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { position: absolute; left: -260px; top: 44px; bottom: 0; transition: 0.3s; }
            aside.open { left: 0; }
            .menu-toggle { display: block; }
        }

        /* Modal Stil Dosyaları */
        .modal-backdrop { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
        .modal-backdrop.open { display: flex; }
        .modal { background: #2d2d30; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; border: 1px solid #4e4f60; }
        .modal h3 { margin-bottom: 15px; color: #fff; }
        .task { background: #1e1e1f; padding: 10px; border-radius: 5px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 2px; }
        .task small { color: #aaa; }
        .close-modal-btn { background: #e74c3c; border:none; color:#fff; padding:8px; width:100%; border-radius:5px; margin-top:10px; cursor:pointer; font-weight:bold; }
    </style>
</head>
<body>

    <button class="menu-toggle" id="menuBtn">☰ Menü</button>

    <aside id="sidebar">
        <div class="sidebar-header">Mindo</div>
        <button class="nav-btn" id="newChat">+ Yeni Sohbet</button>
        
        <div class="history-list" id="history"></div>

        <div class="stats-area">
            <div><strong>XP Puanı:</strong> <span id="xpStat">0</span></div>
            <div><strong>Seviye:</strong> <span id="levelStat">1</span></div>
            <div><strong>Sohbetler:</strong> <span id="chatStat">0</span></div>
        </div>

        <button class="nav-btn" id="tasksBtn">🏆 Görevler & Başarımlar</button>
        <button class="nav-btn" id="exportBtn">💾 Verileri Dışa Aktar</button>
        <button class="nav-btn" id="clearBtn" style="color: #ff4d4d; border-color: #ff4d4d;">🗑️ Verileri Temizle</button>

        <!-- API AYAR ALANI -->
        <div style="background: #2a2b32; padding: 10px; border-radius: 5px; margin-top: 5px; border: 1px solid #4e4f60;">
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #fff;">⚙️ Mindo API Ayarı</div>
            <input type="password" id="apiKeyInput" placeholder="Hugging Face Token" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #4e4f60; background: #343541; color: #fff; font-size: 12px; margin-bottom: 5px;">
            <button id="saveKeyBtn" style="width: 100%; padding: 6px; background: #10a37f; color: #fff; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;">Kaydet</button>
        </div>
    </aside>

    <main>
        <div class="chat-header" id="chatTitle">Mindo | Web Edition</div>
        
        <div class="welcome-screen" id="welcome">
            <h1>Merhaba, ben Mindo!</h1>
            <p>Meta Llama 3 altyapısıyla güçlendirilmiş gerçek bir yapay zekayım. Sol taraftaki ayarlardan Hugging Face tokenınızı girerek benimle konuşmaya başlayabilirsiniz.</p>
        </div>

        <div class="messages-container" id="messages"></div>

        <div class="input-area">
            <form class="input-container" id="composer">
                <input type="text" id="input" placeholder="Mindo'ya bir şeyler yazın..." autocomplete="off">
                <button type="submit" class="send-btn">➔</button>
            </form>
        </div>
    </main>

    <!-- GÖREVLER MODAL PENCERESİ -->
    <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
            <h3>🏆 Görevler ve Başarımlar</h3>
            <div id="taskContent"></div>
            <button class="close-modal-btn" id="closeModal">Kapat</button>
        </div>
    </div>

<script>
(() => {
    const getEl = id => document.getElementById(id);
    const STORAGE_KEY = "mindo_storage_v1";
    let state = loadState();
    let currentId = state.currentId;

    const tasks = [
        {id:"first", title:"İlk Sohbet", desc:"Mindo'ya ilk mesajınızı gönderin."},
        {id:"three", title:"Sohbet Ustası", desc:"Bir sohbet içinde en az 3 mesaj yazın."},
        {id:"five", title:"Sıkı Kullanıcı", desc:"Toplamda 5 adet mesaj sınırına ulaşın."},
        {id:"idea", title:"Girişimci", desc:"Mesajınızda 'proje', 'fikir' veya 'yazılım' kelimelerini geçirin."}
    ];

    function loadState(){
        try {
            const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
            if(s && Array.isArray(s.chats)) return s;
        } catch(e){}
        return {chats:[], currentId:null, xp:0, completed:[], totalMessages:0};
    }

    function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
    function uid(){ return "c" + Date.now().toString(36); }
    function level(){ return Math.floor(state.xp / 50) + 1; }
    function currentChat(){ return state.chats.find(c => c.id === currentId); }
    
    function makeChat(){
        const c = {id: uid(), title: "Yeni Sohbet", messages: []};
        state.chats.push(c);
        currentId = c.id;
        state.currentId = c.id;
        save(); render();
        return c;
    }

    function escapeHTML(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    
    function addMessage(role, text){
        const c = currentChat() || makeChat();
        c.messages.push({role, text});
        save(); render();
    }

    function complete(id){
        if(state.completed.includes(id)) return;
        state.completed.push(id);
        state.xp += 20;
        save(); render();
    }
    
    function checkTasks(userText){
        const c = currentChat();
        if(state.totalMessages >= 1) complete("first");
        if(c && c.messages.length >= 6) complete("three"); // 3 kullanıcı + 3 bot mesajı
        if(state.totalMessages >= 5) complete("five");
        if(/(proje|fikir|yazılım|geliştir)/i.test(userText)) complete("idea");
    }

    async function sendText(text){
        text = text.trim(); if(!text) return;
        if(!currentChat()) makeChat();
        
        addMessage("user", text);
        state.totalMessages++;
        state.xp += 5;
        save(); render();
        getEl("input").focus();
        checkTasks(text);

        const HF_TOKEN = localStorage.getItem("user_api_key");
        if (!HF_TOKEN) {
